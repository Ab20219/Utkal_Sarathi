<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Sacred Crimson to Obsidian -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0808" />
      <stop offset="45%" stop-color="#4a0e0e" />
      <stop offset="85%" stop-color="#1c0707" />
      <stop offset="100%" stop-color="#0f0404" />
    </linearGradient>

    <!-- Sun Dawn Aura Gradient: Puri Coast Morning Radiance -->
    <radialGradient id="sunAura" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.75" />
      <stop offset="65%" stop-color="#dc2626" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Divine Neelachakra Azure/Indigo Accent -->
    <linearGradient id="neelaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Patitapabana Flag Vermilion Gradient -->
    <linearGradient id="dhwajaGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <filter id="divineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Canvas with Rounded Squircle Border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.5" />

  <!-- Radiant Sunrise Halo Behind Temple -->
  <circle cx="256" cy="260" r="170" fill="url(#sunAura)" />

  <!-- Sacred Kalinga Floral / Geometric Halo Ring -->
  <circle cx="256" cy="260" r="162" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.65" />
  <circle cx="256" cy="260" r="148" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.4" />

  <!-- ============================================== -->
  <!-- SHREE JAGANNATH TEMPLE PURI SILHOUETTE         -->
  <!-- Curvilinear Rekha Deula (Vimana) Architecture   -->
  <!-- ============================================== -->

  <!-- Temple Plinth & Singhadwara Foundation -->
  <path d="M 120 420 L 392 420 L 376 392 L 136 392 Z" fill="#1c0707" stroke="url(#goldGrad)" stroke-width="2.5" />
  <path d="M 144 392 L 368 392 L 356 368 L 156 368 Z" fill="#2d0a0a" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Main Rekha Deula Spire Body (Curvilinear Parabolic Kalinga Spire) -->
  <path d="M 172 368 
           C 176 310, 186 240, 204 185
           C 214 155, 230 135, 244 118
           L 268 118
           C 282 135, 298 155, 308 185
           C 326 240, 336 310, 340 368
           Z" 
        fill="#180404" 
        stroke="url(#goldGrad)" 
        stroke-width="3.5" />

  <!-- Horizontal Terraces / Bhumi Amlas (Distinctive Kalinga Ridges) -->
  <g stroke="url(#goldGrad)" stroke-width="2" opacity="0.85">
    <line x1="178" y1="344" x2="334" y2="344" />
    <line x1="184" y1="318" x2="328" y2="318" />
    <line x1="192" y1="290" x2="320" y2="290" />
    <line x1="202" y1="260" x2="310" y2="260" />
    <line x1="214" y1="228" x2="298" y2="228" />
    <line x1="228" y1="192" x2="284" y2="192" />
    <line x1="238" y1="158" x2="274" y2="158" />
  </g>

  <!-- Central Sanctum Rahapaga Spine (Vertical Projection) -->
  <path d="M 248 368 L 248 122 L 264 122 L 264 368 Z" fill="#2d0a0a" stroke="url(#goldGrad)" stroke-width="1.5" />

  <!-- Sacred Singhadwara Sanctum Arch (Lion Gate Sacred Archway) -->
  <path d="M 234 420 L 234 350 C 234 336, 278 336, 278 350 L 278 420 Z" fill="#0a0202" stroke="url(#goldGrad)" stroke-width="3" />
  <!-- Radiant Sanctum Lamp (Akhanda Dipa) -->
  <circle cx="256" cy="365" r="7" fill="#fef08a" filter="url(#divineGlow)" />
  <circle cx="256" cy="365" r="3.5" fill="#ffffff" />

  <!-- ============================================== -->
  <!-- MAJESTIC TEMPLE CROWN (MASTAKA)                -->
  <!-- Beki, Amlas, Kalasa & The Divine Neelachakra   -->
  <!-- ============================================== -->

  <!-- Beki (Neck plinth) -->
  <rect x="246" y="112" width="20" height="6" fill="#f59e0b" rx="2" />

  <!-- Amalaka (Ribbed Stone Disc Crown) -->
  <ellipse cx="256" cy="107" rx="22" ry="7" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1.5" />

  <!-- Khapuri & Kalasa (Golden Pitcher Spire) -->
  <path d="M 249 104 C 248 94, 264 94, 263 104 Z" fill="#fef08a" stroke="#d97706" stroke-width="1" />
  <circle cx="256" cy="92" r="5" fill="#fef08a" stroke="#b45309" stroke-width="1" />

  <!-- Sacred NEELACHAKRA (Divine Blue/Gold 8-Spoked Wheel) -->
  <g filter="url(#divineGlow)">
    <!-- Outer Azure Ring -->
    <circle cx="256" cy="74" r="17" fill="none" stroke="url(#neelaGrad)" stroke-width="4" />
    <circle cx="256" cy="74" r="13" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
    <!-- 8 Divine Wheel Spokes -->
    <line x1="256" y1="58" x2="256" y2="90" stroke="url(#goldGrad)" stroke-width="2" />
    <line x1="240" y1="74" x2="272" y2="74" stroke="url(#goldGrad)" stroke-width="2" />
    <line x1="244.7" y1="62.7" x2="267.3" y2="85.3" stroke="url(#goldGrad)" stroke-width="1.5" />
    <line x1="244.7" y1="85.3" x2="267.3" y2="62.7" stroke="url(#goldGrad)" stroke-width="1.5" />
    <!-- Sacred Central Hub (Nabhi) -->
    <circle cx="256" cy="74" r="4.5" fill="url(#goldGrad)" />
    <circle cx="256" cy="74" r="2" fill="#ffffff" />
  </g>

  <!-- Sacred PATITAPABANA DHWAJA (Holy Triangle Temple Flag) -->
  <!-- Fluttering in the sacred sea breeze towards the right -->
  <path d="M 256 57 
           C 272 54, 290 60, 308 55
           C 318 52, 332 50, 342 54
           L 295 69
           C 282 72, 268 67, 256 68
           Z" 
        fill="url(#dhwajaGrad)" 
        stroke="#fef08a" 
        stroke-width="1.5" 
        filter="url(#divineGlow)" />

  <!-- Gold Finial Spire Pin -->
  <line x1="256" y1="52" x2="256" y2="58" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" />

  <!-- Flanking Subsidiary Spires (Pancharatha Deula Harmony) -->
  <path d="M 152 380 C 154 340, 162 290, 178 260 L 192 260 C 182 300, 174 345, 172 380 Z" fill="#140303" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8" />
  <path d="M 360 380 C 358 340, 350 290, 334 260 L 320 260 C 330 300, 338 345, 340 380 Z" fill="#140303" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8" />

  <!-- Subtle Compass Travel Pip at Bottom (UtkalSarathi - The Guide) -->
  <g transform="translate(256, 460)">
    <circle cx="0" cy="0" r="16" fill="#1c0707" stroke="url(#goldGrad)" stroke-width="2" />
    <polygon points="0,-12 4,-2 0,-4 -4,-2" fill="#ef4444" />
    <polygon points="0,12 4,2 0,4 -4,2" fill="#e2e8f0" />
    <circle cx="0" cy="0" r="2.5" fill="#f59e0b" />
  </g>
</svg>
