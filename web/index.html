<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UtkalSarathi — Smart Tourism, Cultural Heritage &amp; Safety for Odisha</title>
    <meta
      name="description"
      content="Discover Odisha, Your Way. Explore all 30 official Odisha districts, voice-narrated Utkal Katha stories, multilingual English/Odia/Hindi guides, deterministic INR trip budgets, fair fare estimates, WhatsApp sharing, and SOS 112 traveller safety."
    />
    <meta name="theme-color" content="#0B0D10" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- OpenGraph & WhatsApp Rich Preview Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UtkalSarathi" />
    <meta property="og:title" content="UtkalSarathi — Smart Tourism &amp; Traveller Safety for Odisha" />
    <meta
      property="og:description"
      content="All 30 Odisha districts, Utkal Katha voice stories, GI crafts &amp; cuisine, trip budget planner, transit fare estimates, and live GPS safety tools."
    />
    <meta property="og:url" content="https://utkalsarathi.vercel.app" />
    <meta property="og:image" content="https://utkalsarathi.vercel.app/images/hero-puri-konark.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Typography: Playfair Display + Plus Jakarta Sans + Odia & Devanagari Scripts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&amp;family=Noto+Sans+Oriya:wght@400;600;700&amp;family=Playfair+Display:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <a href="#app-main" class="skip-link">Skip to main content</a>

    <!-- Sticky Header -->
    <header class="site-header" role="banner">
      <div class="header-inner">
        <button type="button" class="brand-lockup" id="brand-home-btn" aria-label="UtkalSarathi Home">
          <img
            src="/images/utkal-emblem.jpg"
            alt="UtkalSarathi Konark Chariot Wheel &amp; Compass Emblem"
            class="brand-logo"
            onerror="this.src='/favicon.svg'"
          />
          <span>
            <span class="brand-title" id="hdr-brand-name">UtkalSarathi</span>
            <span class="brand-tagline" id="hdr-brand-tagline">Discover Odisha, Your Way.</span>
          </span>
        </button>

        <div class="header-actions">
          <div class="lang-switcher" role="group" aria-label="Interface Language">
            <button type="button" class="lang-btn active" data-lang="en">EN</button>
            <button type="button" class="lang-btn" data-lang="or">ଓଡ଼ିଆ</button>
            <button type="button" class="lang-btn" data-lang="hi">हिन्दी</button>
          </div>

          <button type="button" class="btn btn-outline btn-sm" id="hdr-cloud-btn">
            ☁️ <span id="hdr-cloud-label">Cloud Vault</span>
          </button>

          <button type="button" class="btn btn-whatsapp btn-sm" id="hdr-whatsapp-btn">
            📲 <span id="hdr-share-label">Share on WhatsApp</span>
          </button>

          <a href="tel:112" class="btn btn-sos btn-sm" id="hdr-sos-link" aria-label="Dial Emergency SOS 112">
            🚨 <span id="hdr-sos-label">SOS 112</span>
          </a>
        </div>
      </div>

      <!-- Desktop Navigation -->
      <nav class="desktop-nav" id="desktop-nav" aria-label="Primary Navigation"></nav>
    </header>

    <!-- Main Dynamic View Root -->
    <main id="app-main" class="main-container" tabindex="-1">
      <noscript>
        <div class="empty-state">
          <h2>JavaScript Required</h2>
          <p>Please enable JavaScript to use UtkalSarathi's interactive 30-district encyclopedia, trip planner, and safety tools.</p>
        </div>
      </noscript>
    </main>

    <!-- Footer -->
    <footer class="site-footer" role="contentinfo">
      <div>
        <strong>UtkalSarathi — Smart Tourism &amp; Safety for Odisha</strong><br />
        <span>All 30 Official Districts • English, ଓଡ଼ିଆ &amp; हिन्दी • Emergency Police/Fire: 112 • Ambulance: 108</span>
      </div>
      <div>
        <span>Official Portals: </span>
        <a href="https://odishatourism.gov.in" target="_blank" rel="noopener noreferrer">Odisha Tourism</a> •
        <a href="https://www.ecotourodisha.com" target="_blank" rel="noopener noreferrer">Eco-Tour Odisha</a> •
        <a href="https://osdma.org" target="_blank" rel="noopener noreferrer">OSDMA Alerts</a>
      </div>
    </footer>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav" id="mobile-bottom-nav" aria-label="Mobile Navigation"></nav>

    <!-- Floating Web Speech Audio Narrator -->
    <aside class="audio-player-bar" id="audio-player-bar" hidden aria-live="polite">
      <div style="flex: 1 1 240px">
        <strong id="audio-now-title" style="color: var(--gold); display: block; font-size: 0.92rem">Utkal Katha</strong>
        <span id="audio-now-meta" style="color: var(--ivory-muted); font-size: 0.78rem">Narrating...</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
        <label for="audio-speed-select" style="font-size: 0.76rem; color: var(--ivory-muted)">Speed</label>
        <select id="audio-speed-select" class="form-select" style="width: auto; min-height: 36px; padding: 4px 8px">
          <option value="0.85">0.85x</option>
          <option value="1" selected>1.0x</option>
          <option value="1.15">1.15x</option>
          <option value="1.3">1.3x</option>
        </select>
        <button type="button" class="btn btn-outline btn-sm" id="audio-pause-btn">Pause</button>
        <button type="button" class="btn btn-sos btn-sm" id="audio-stop-btn">Stop</button>
      </div>
    </aside>

    <!-- Accessible Modal Container -->
    <div class="modal-backdrop" id="modal-backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-dialog" id="modal-content"></div>
    </div>

    <!-- Toast Feedback -->
    <div class="toast" id="toast-box" hidden role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
